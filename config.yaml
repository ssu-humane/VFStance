data_path: ../data/k-news-stance-mm-acl-arr.json
env_path: ../.env
output_dir: ./output/processed
image_dir: ./output/images
vlm_model: Qwen/Qwen2.5-VL-7B-Instruct
clip_model: Bingsu/clip-vit-large-patch14-ko
t2i_model: stabilityai/stable-diffusion-3-medium-diffusers
chatgpt_model: gpt-4o-mini
stage1:
  lr: 1e-4
  epochs: 3
  batch_size: 4
  gradient_accumulation: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  device: cuda:0
  max_length: 5864
stage2:
  sd3_inference_steps: 28
  sd3_guidance_scale: 7
  chatgpt_temperature: 0
  chatgpt_top_p: 1.0
  max_body_sentences: 3
  device: cuda:1
stage3:
  pagerank_damping: 0.85
  pagerank_threshold: 1e-6
  pagerank_max_iter: 100
  device: cuda:2
stage4:
  lr: 1e-4
  epochs: 3
  batch_size: 4
  gradient_accumulation: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_length: 7251
  num_runs: 5
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  device: cuda:0
